name: Windows checkpoint

on:
  push:
    branches:
      [feat/windows-ghidra-checkpoint, perf/windows-ghidra-session-reuse]
  pull_request:
    paths:
      - "src/ghidra/**"
      - "src/application/binary/**"
      - "src/ports/**"
      - "src/windows/**"
      - "src/config/**"
      - "bridge/ghidra/**"
      - "scripts/verify-real-ghidra-windows-checkpoints.mjs"
      - ".github/workflows/windows-checkpoint.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Checkpoint and Windows ACL tests
        run: >-
          npx vitest run
          src/windows/WindowsCheckpointDirectory.test.ts
          src/ghidra/GhidraCheckpoint.test.ts
          src/application/binary/BinarySessionRetainedSwitch.test.ts
          src/application/binary/BinarySessionRestoration.test.ts
          src/application/binary/CompositeProvider.test.ts
          src/config.test.ts
