name: Windows checkpoint

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/ghidra/**"
      - "src/application/binary/**"
      - "src/ports/**"
      - "src/windows/**"
      - "src/config/**"
      - "bridge/ghidra/**"
      - "scripts/verify-real-ghidra-windows-checkpoints.mjs"
      - ".github/workflows/windows-checkpoint.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Cache npm package downloads
        uses: ./.github/actions/npm-cache
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run typecheck
      - name: Checkpoint and Windows ACL tests
        run: >-
          npx vitest run
          src/windows/WindowsCheckpointDirectory.test.ts
          src/ghidra/GhidraCheckpoint.test.ts
          src/application/binary/BinarySessionRetainedSwitch.test.ts
          src/application/binary/BinarySessionRestoration.test.ts
          src/application/binary/CompositeProvider.test.ts
          src/config.test.ts
